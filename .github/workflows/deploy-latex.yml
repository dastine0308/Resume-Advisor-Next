name: LaTeX Service CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "latex-service/**"
      - "Dockerfile.latex"
      - ".github/workflows/deploy-latex.yml"
  pull_request:
    branches: [main]
    paths:
      - "latex-service/**"
      - "Dockerfile.latex"
      - ".github/workflows/deploy-latex.yml"

env:
  IMAGE_NAME: ${{ github.repository_owner }}/resume-advisor-latex

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Run LaTeX service unit tests
        run: npm ci && npm test -- --run latex-service/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push with layer cache
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.latex
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=ghcr.io/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Log in to Azure
        if: github.event_name != 'pull_request'
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Container App image
        if: github.event_name != 'pull_request'
        run: |
          az containerapp update \
            --name ca-latex-service \
            --resource-group rg-resume-advisor \
            --image ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --set-env-vars \
              "NODE_ENV=production" \
              "PORT=80" \
              "MAX_CONCURRENT_COMPILES=2" \
              "MAX_COMPILE_QUEUE=5" \
              "COMPILE_QUEUE_WAIT_MS=120000"
